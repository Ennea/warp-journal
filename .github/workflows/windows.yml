name: Windows Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up UV
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Resolve project version
        id: version
        shell: bash
        run: |
          version=$(uvx hatch version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Write generated version module
        run: uvx hatch build --hooks-only

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . nuitka ordered-set zstandard

      - name: Build standalone executable
        run: >
          python -m nuitka
          --assume-yes-for-downloads
          --output-dir=build
          --output-filename=warp-journal.exe
          warp_journal/__main__.py

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: >
          & "C:\Program Files (x86)\NSIS\makensis.exe"
          /DVERSION=${{ steps.version.outputs.version }}
          warp-journal.nsi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: warp-journal-nightly-installer-${{ steps.version.outputs.version }}
          path: warp-journal-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

  release-windows-installer:
    runs-on: ubuntu-latest
    needs: build-windows-installer
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: warp-journal-nightly-installer-${{ needs.build-windows-installer.outputs.version }}

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          name: Warp Journal ${{ needs.build-windows-installer.outputs.version }}
          generate_release_notes: true
          files: |
            warp-journal-${{ needs.build-windows-installer.outputs.version }}.exe
          fail_on_unmatched_files: true
