[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "warp-journal"
version = "1.1.0"
description = "Honkai: Star Rail gacha tracker and analysis."
authors = [{name = "Ennea"}, {name = "FichteFoll", email = "fichtefoll2@googlemail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "bottle>=0.12.25,<0.14",
    "gevent>22.10",
    "gevent-websocket>=0.10.1,<0.11",
    "greenlet>=3.0.0,<4",
    "zope.event>=4.6,<5",
    "zope.interface>=6.0,<7",
]

[project.scripts]
warp-journal = "warp_journal.__main__:main"

[project.optional-dependencies]
dev = [
    "flake8>=6.0.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["warp_journal"]

[tool.pyright]
defineConstant = { DEBUG = true }

reportMissingTypeStubs = "information"
reportImportCycles = "warning"

pythonVersion = "3.10"
pythonPlatform = "All"
